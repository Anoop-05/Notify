<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}?v=1.0">
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Notify Logo">
        </div>
        <div class="nav-links">
            <a href="{{url_for('home')}}" class="home-btn">Home</a>
            <a href="{{url_for('schedule')}}" class="schedule-btn">Schedule Notify</a>
        </div>
    </nav>
    <div class="container">
        <h2>Join Notify Now</h2>
        <p style="color: aliceblue;" align="center">Stay updated with real-time alerts! 🚀</p>
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" placeholder="Enter Your Address" required></textarea>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <p class="success-msg" id="successMessage"></p>
    </div>
    <div class="wildgrass"></div>
    <script src="{{ url_for('static', filename='js/snowfall.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
