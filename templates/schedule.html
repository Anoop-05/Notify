<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Notification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/schedule.css') }}?v=1.0">
</head>
<body>

    <!-- Fire Background Effect -->
    <div class="fire-effect"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Notify Logo">
        </div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}" class="home-btn">Home</a>
        </div>
    </nav>

    <!-- Schedule Form -->
    <div class="container">
        <div class="schedule-box">
            <h2>Schedule a Notification</h2>
            <form id="scheduleForm">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="Your Email" required>
                <input type="datetime-local" id="dateTime" required>
                <textarea id="message" placeholder="Your Message" rows="3" required></textarea>
                <button type="submit">Schedule Now</button>
            </form>
        </div>
    </div>

    <!-- Made By Section -->
    <footer class="fire-footer">
        <p>Made By:</p>
        <ul>
            <li class="fire-name">Anoop Kumar K M</li>
        </ul>
    </footer>
    
    <script src="{{ url_for('static', filename='js/schedule.js') }}"></script>
</body>
</html>
